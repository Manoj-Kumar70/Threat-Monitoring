<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Threat Monitoring Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <a class="navbar-brand ms-3" href="#">🛡 Threat Dashboard</a>

        <div class="ms-auto me-3">
            <button id="loginBtn" class="btn btn-outline-light me-2"
                    data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
            <button id="registerBtn" class="btn btn-outline-info me-2"
                    data-bs-toggle="modal" data-bs-target="#registerModal">Register</button>
            <button id="logoutBtn" class="btn btn-danger d-none" onclick="logout()">Logout</button>
            {% comment %} <button id="eventList" class="btn btn-danger d-none" onclick="loadEvents()">Events</button> {% endcomment %}
        </div>
    </nav>

    <!-- CREATE EVENT (ADMIN ONLY) -->
    <div id="createEventCard" class="card mb-4 d-none">
        <div class="card-header">Create Event (Admin)</div>
        <div class="card-body">
            <input id="source" class="form-control mb-2" placeholder="Source Name">
            <input id="etype" class="form-control mb-2" placeholder="Event Type">
            <select id="severity" class="form-control mb-2">
                <option disabled selected>Select Severity</options>
                <option>LOW</option>
                <option>MEDIUM</option>
                <option>HIGH</option>
                <option>CRITICAL</option>
            </select>
            <textarea id="desc" class="form-control mb-2" placeholder="Description"></textarea>
            <div id="eventMessage" class="mb-2"></div>
            <button class="btn btn-danger" onclick="createAlertEvent()">Submit Event</button>
        </div>
    </div>

    <!-- EVENTS List -->
    <div class="card mb-4 d-none" id="events-card">
        <div class="card-header">Events (Admin)</div>
        <div class="card-body">

            <!-- EVENT TABLE -->
            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Source</th>
                            <th>Type</th>
                            <th>Severity</th>
                            <th>Description</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="events"></tbody>
                </table>
            </div>

            <!-- PAGINATION -->
            <nav class="d-flex justify-content-end">
                <ul class="pagination" id="eventsPagination"></ul>
            </nav>
        </div>
    </div>

    <!-- ALERTS -->
    <div class="card d-none" id="alerts-card">
        <div class="card-header">Alerts (High & Critical)</div>
        <div class="card-body">

            <!-- FILTERS -->
            <div class="row mb-3">
                <div class="col-md-3">
                    <select id="filterSeverity" class="form-control" onchange="loadAlerts(1)">
                        <option value="">All Severities</option>
                        <option value="LOW">LOW</option>
                        <option value="MEDIUM">MEDIUM</option>
                        <option value="HIGH">HIGH</option>
                        <option value="CRITICAL">CRITICAL</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <select id="filterStatus" class="form-control" onchange="loadAlerts(1)">
                        <option value="">All Status</option>
                        <option value="OPEN">OPEN</option>
                        <option value="ACK">ACKNOWLEDGED</option>
                        <option value="RESOLVED">RESOLVED</option>
                    </select>
                </div>
            </div>

            <!-- ALERT LIST -->
            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Event Type</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>Time</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="alerts"></tbody>
                </table>
            </div>


            <!-- PAGINATION -->
            <nav class="d-flex justify-content-end">
                <ul class="pagination" id="pagination"></ul>
            </nav>
        </div>
    </div>
</div>

<!-- LOGIN MODAL -->
<div class="modal fade" id="loginModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>Login</h5></div>
            <div class="modal-body">
                <input id="username" class="form-control mb-2" placeholder="Username">
                <input id="password" type="password" class="form-control mb-2" placeholder="Password">
                <div id="messageBox" class="text-danger small mb-2"></div>
                <button class="btn btn-primary w-100" onclick="login()">Login</button>
            </div>
        </div>
    </div>
</div>

<!-- REGISTER MODAL -->
<div class="modal fade" id="registerModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>Register</h5></div>
            <div class="modal-body">
                <input id="regUsername" class="form-control mb-2" placeholder="Username">
                <input id="regPassword" type="password" class="form-control mb-2" placeholder="Password">
                <select id="regRole" class="form-control mb-2">
                    <option value="ANALYST">Analyst</option>
                    <option value="ADMIN">Admin</option>
                </select>
                <button class="btn btn-success w-100" onclick="register()">Register</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
let currentPage = 1;

/* ---------- AUTH ---------- */
window.onload = () => {
    updateUI();
    if (getToken()) loadAlerts();
    if (getRole()) loadEvents();
};

function getToken() {
    return localStorage.getItem('access_token');
}

function getRole() {
    role = localStorage.getItem('role');
    if (role ==="ADMIN") {
        return role;
    }

}

function updateUI() {
    const loggedIn = !!getToken();
    const role = localStorage.getItem('role');

    document.getElementById('events-card').classList.toggle("d-none", !loggedIn);

    loginBtn.classList.toggle("d-none", loggedIn);
    registerBtn.classList.toggle("d-none", loggedIn);
    logoutBtn.classList.toggle("d-none", !loggedIn);

    document.getElementById('alerts-card').classList.toggle("d-none", !loggedIn);
    document.getElementById('createEventCard').classList.toggle("d-none", role !== "ADMIN");
    document.getElementById('events-card').classList.toggle("d-none", role !== "ADMIN");
}

function login() {
    fetch('/api/token/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: username.value,
            password: password.value
        })
    })
    .then(res => res.json())
    .then(data => {

        if (data.detail) {
            messageBox.innerText = data.detail
            return;
        }

        localStorage.setItem('access_token', data.access);
        localStorage.setItem('refresh_token', data.refresh);
        localStorage.setItem('role', data.user.role);

        role = localStorage.getItem('role');
        if (role ==="ADMIN") {
            loadEvents();
        }

        updateUI();
        loadAlerts();

        bootstrap.Modal.getInstance(loginModal).hide();
    });
}

function register() {

    fetch("/api/register/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            username: regUsername.value,
            password: regPassword.value,
            role: regRole.value
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.message) {
            alert("Registration successful!");
            location.reload();
        } else {
            alert(JSON.stringify(data));
        }
    })
    .catch(error => {
        console.error("Error:", error);
    });
}

function logout() {
    localStorage.clear();
    location.reload();
}

/* ---------- EVENTS ---------- */
async function createAlertEvent() {
    const messageDiv = document.getElementById('eventMessage');
    messageDiv.innerHTML = ''; // clear previous messages
    messageDiv.className = 'mb-2'; // reset classes

    const res = await fetch('/api/events/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + getToken()
        },
        body: JSON.stringify({
            source_name: document.getElementById('source').value,
            event_type: document.getElementById('etype').value,
            severity: document.getElementById('severity').value,
            description: document.getElementById('desc').value
        })
    });

    const data = await res.json();

    if (res.status === 201) {
        messageDiv.classList.add('text-success');
        messageDiv.innerHTML = data.message || "Event created successfully";
        loadAlerts(1);
    } else if (res.status === 400) {
        messageDiv.classList.add('text-danger');
        let messages = [];
        for (const field in data.errors) {
            messages.push(`${field}: ${data.errors[field].join(", ")}`);
        }
        messageDiv.innerHTML = messages.join("<br>");
    } else {
        messageDiv.classList.add('text-danger');
        messageDiv.innerHTML = data.message || "Error creating event";
    }
}



/* ---------- ALERTS (FILTER + PAGINATION) ---------- */
function loadAlerts(page = 1) {
    currentPage = page;

    const severity = filterSeverity.value;
    const status = filterStatus.value;

    let url = `/api/alerts/?page=${page}`;

    if (severity) url += `&event__severity=${severity}`;
    if (status) url += `&status=${status}`;

    fetch(url, {
        headers: {'Authorization': 'Bearer ' + getToken()}
    })
    .then(res => res.json())
    .then(data => {
        alerts.innerHTML = "";
        pagination.innerHTML = "";

        console.log('mkk', data.results);

        if (!data.results || data.results.length === 0) {
            alerts.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-muted">
                        No alerts found
                    </td>
                </tr>
            `;
            return;
        }

        const role = localStorage.getItem('role');

        data.results.forEach(a => {
            let action = '-';

            if (role === 'ADMIN') {
                action = `
                    <select class="form-select form-select-sm"
                            onchange="updateAlertStatus(${a.id}, this.value)">
                        <option value="">Change</option>
                        <option value="OPEN">OPEN</option>
                        <option value="ACK">ACKNOWLEDGED</option>
                        <option value="RESOLVED">RESOLVED</option>
                    </select>
                `;
            }

            alerts.innerHTML += `
                <tr>
                    <td>${a.id}</td>
                    <td>${a.event.event_type}</td>
                    <td>
                        <span class="badge bg-${getSeverityColor(a.event.severity)}">
                            ${a.event.severity}
                        </span>
                    </td>
                    <td>${a.status}</td>
                    <td>${formatDateTime(a.created_at)}</td>
                    <td>${action}</td>
                </tr>
            `;
        });

        if (data.previous) {
            pagination.innerHTML += `
                <li class="page-item">
                    <button class="page-link" onclick="loadAlerts(${currentPage - 1})">Previous</button>
                </li>`;
        }

        if (data.next) {
            pagination.innerHTML += `
                <li class="page-item">
                    <button class="page-link" onclick="loadAlerts(${currentPage + 1})">Next</button>
                </li>`;
        }
    });
}

function formatDateTime(isoString) {
    const d = new Date(isoString);
    return d.toLocaleString("en-GB", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });
}


function getSeverityColor(severity) {
    if (severity === 'LOW') return 'success';
    if (severity === 'MEDIUM') return 'warning';
    if (severity === 'HIGH') return 'danger';
    if (severity === 'CRITICAL') return 'dark';
    return 'secondary';
}

let eventPage = 1;

function loadEvents(page = 1) {
    eventPage = page;

    fetch(`/api/events/?page=${page}`, {
        headers: {'Authorization': 'Bearer ' + getToken()}
    })
    .then(res => res.json())
    .then(data => {
        events.innerHTML = "";
        eventsPagination.innerHTML = "";

        console.log('events', data.results);

        if (!data.results || data.results.length === 0) {
            events.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-muted">
                        No events found
                    </td>
                </tr>
            `;
            return;
        }

        data.results.forEach(e => {
            events.innerHTML += `
                <tr>
                    <td>${e.id}</td>
                    <td>${e.source_name}</td>
                    <td>${e.event_type}</td>
                    <td>
                        <span class="badge bg-${getSeverityColor(e.severity)}">
                            ${e.severity}
                        </span>
                    </td>
                    <td>${e.description}</td>
                    <td>${formatDateTime(e.timestamp)}</td>
                </tr>
            `;
        });

        if (data.previous) {
            eventsPagination.innerHTML += `
                <li class="page-item">
                    <button class="page-link"
                        onclick="loadEvents(${eventPage - 1})">
                        Previous
                    </button>
                </li>`;
        }

        if (data.next) {
            eventsPagination.innerHTML += `
                <li class="page-item">
                    <button class="page-link"
                        onclick="loadEvents(${eventPage + 1})">
                        Next
                    </button>
                </li>`;
        }
    });
}



function updateAlertStatus(alertId, status) {
    if (!status) return;

    fetch(`/api/alerts/${alertId}/`, {
        method: 'PATCH',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + getToken()
        },
        body: JSON.stringify({ status: status })
    })
    .then(res => {
        if (res.status === 403) {
            alert("Permission denied");
            return;
        }
        if (!res.ok) {
            alert("Failed to update alert");
            return;
        }
        loadAlerts(currentPage);
    });
}


</script>

</body>
</html>
